<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambient Tracks</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ea;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #050505 70%);
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
            align-items: stretch;
        }

        .track-card {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .track-card:hover {
            transform: translateY(-5px);
        }

        .card-p1:hover { box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); }
        .card-p2:hover { box-shadow: 0 0 20px rgba(255, 0, 234, 0.2); }

        .image-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            background: #000;
        }

        .image-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
        }

        .card-p1 .title { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
        .card-p2 .title { color: var(--neon-pink); text-shadow: 0 0 10px rgba(255, 0, 234, 0.5); }

        /* Custom Audio Player */
        .player {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .play-btn {
            background: none;
            border: 1px solid var(--glass-border);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .card-p1 .play-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }
        .card-p2 .play-btn:hover { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 10px rgba(255, 0, 234, 0.3); }

        .play-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .progress-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]:focus {
            outline: none;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .card-p1 input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: var(--neon-cyan);
            margin-top: -4px;
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        .card-p2 input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: var(--neon-pink);
            margin-top: -4px;
            box-shadow: 0 0 8px var(--neon-pink);
        }

        .time {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            font-variant-numeric: tabular-nums;
            display: flex;
            justify-content: space-between;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-container svg {
            width: 16px;
            height: 16px;
            fill: rgba(255, 255, 255, 0.6);
        }

        .volume-container input[type="range"] {
            width: 60px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .track-card {
                width: 100%;
            }
            .image-container img {
                max-height: 40vh;
                object-fit: contain;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Track 1 -->
        <div class="track-card card-p1">
            <div class="image-container">
                <img src="p1.gif" alt="P1 Cover">
            </div>
            <div class="title">P1</div>
            
            <div class="player" data-track="1">
                <audio id="audio1" src="p1.mp3" preload="metadata"></audio>
                <div class="controls">
                    <button class="play-btn" id="play1" aria-label="Play/Pause">
                        <svg id="icon1" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <div class="progress-container">
                        <input type="range" id="seek1" value="0" min="0" max="100" step="0.1">
                        <div class="time">
                            <span id="curr1">0:00</span>
                            <span id="dur1">0:00</span>
                        </div>
                    </div>
                    <div class="volume-container">
                        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        <input type="range" id="vol1" min="0" max="1" step="0.05" value="0.8">
                    </div>
                </div>
            </div>
        </div>

        <!-- Track 2 -->
        <div class="track-card card-p2">
            <div class="image-container">
                <img src="p2.gif" alt="P2 Cover">
            </div>
            <div class="title">P2</div>
            
            <div class="player" data-track="2">
                <audio id="audio2" src="p2.mp3" preload="metadata"></audio>
                <div class="controls">
                    <button class="play-btn" id="play2" aria-label="Play/Pause">
                        <svg id="icon2" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <div class="progress-container">
                        <input type="range" id="seek2" value="0" min="0" max="100" step="0.1">
                        <div class="time">
                            <span id="curr2">0:00</span>
                            <span id="dur2">0:00</span>
                        </div>
                    </div>
                    <div class="volume-container">
                        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        <input type="range" id="vol2" min="0" max="1" step="0.05" value="0.8">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const audio1 = document.getElementById('audio1');
        const audio2 = document.getElementById('audio2');
        const playBtn1 = document.getElementById('play1');
        const playBtn2 = document.getElementById('play2');
        const icon1 = document.getElementById('icon1');
        const icon2 = document.getElementById('icon2');
        const seek1 = document.getElementById('seek1');
        const seek2 = document.getElementById('seek2');
        const vol1 = document.getElementById('vol1');
        const vol2 = document.getElementById('vol2');
        const curr1 = document.getElementById('curr1');
        const curr2 = document.getElementById('curr2');
        const dur1 = document.getElementById('dur1');
        const dur2 = document.getElementById('dur2');

        const playIcon = '<path d="M8 5v14l11-7z"/>';
        const pauseIcon = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

        // Format time
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Toggle Play/Pause
        function togglePlay(audio, btnIcon, otherAudio, otherIcon) {
            if (audio.paused) {
                otherAudio.pause(); // Stop the other track
                otherIcon.innerHTML = playIcon;
                audio.play();
                btnIcon.innerHTML = pauseIcon;
            } else {
                audio.pause();
                btnIcon.innerHTML = playIcon;
            }
        }

        playBtn1.addEventListener('click', () => togglePlay(audio1, icon1, audio2, icon2));
        playBtn2.addEventListener('click', () => togglePlay(audio2, icon2, audio1, icon1));

        // Setup player functions
        function setupPlayer(audio, seekSlider, volSlider, currText, durText, icon) {
            audio.addEventListener('loadedmetadata', () => {
                durText.textContent = formatTime(audio.duration);
            });

            audio.addEventListener('timeupdate', () => {
                if (!seekSlider.dragging) {
                    seekSlider.value = (audio.currentTime / audio.duration) * 100 || 0;
                }
                currText.textContent = formatTime(audio.currentTime);
            });

            audio.addEventListener('ended', () => {
                icon.innerHTML = playIcon;
                seekSlider.value = 0;
            });

            // Seek logic
            seekSlider.addEventListener('input', () => {
                seekSlider.dragging = true;
            });

            seekSlider.addEventListener('change', () => {
                audio.currentTime = (seekSlider.value / 100) * audio.duration;
                seekSlider.dragging = false;
            });

            // Volume logic
            volSlider.addEventListener('input', (e) => {
                audio.volume = e.target.value;
            });
            audio.volume = volSlider.value;
        }

        setupPlayer(audio1, seek1, vol1, curr1, dur1, icon1);
        setupPlayer(audio2, seek2, vol2, curr2, dur2, icon2);
    </script>
</body>
</html>
